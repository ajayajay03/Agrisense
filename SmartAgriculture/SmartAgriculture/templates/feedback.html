{% extends 'base.html' %}{% block content %}
<section class="container narrow py-5">
  <div class="glass p-4">
    <h2>Share feedback</h2>
    <p>Your experience helps make AgriSense more useful in the field.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><label
        >Rating</label
      ><select class="form-select" name="rating">
        {% for x in range(5,0,-1) %}
        <option value="{{x}}">{{x}} star{{'s' if x>1}}</option>
        {% endfor %}</select
      ><label class="mt-3">Comments</label
      ><textarea
        class="form-control"
        rows="5"
        name="comments"
        required
      ></textarea
      ><button class="btn btn-primary mt-3">Send feedback</button>
    </form>
  </div>
</section>
{% endblock %}
