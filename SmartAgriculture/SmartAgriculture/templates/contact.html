{% extends 'base.html' %}{% block content %}
<section class="page-head">
  <div class="container">
    <h2>Contact us</h2>
    <p>We welcome product questions and farmer partnerships.</p>
  </div>
</section>
<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-6">
      <form method="post" class="glass p-4">
        <input
          type="hidden"
          name="csrf_token"
          value="{{ csrf_token() }}"
        /><input
          class="form-control mb-3"
          name="name"
          placeholder="Your name"
          required
        /><input
          class="form-control mb-3"
          name="email"
          type="email"
          placeholder="Email"
          required
        /><textarea
          class="form-control"
          name="message"
          rows="5"
          placeholder="How can we help?"
          required
        ></textarea
        ><button class="btn btn-primary mt-3">Send message</button>
      </form>
    </div>
    <div class="col-lg-6"><div id="contactMap"></div></div>
  </div>
</div>
{% endblock %}{% block scripts %}
<script>
  const m = L.map("contactMap").setView([12.9716, 77.5946], 11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap",
  }).addTo(m);
  L.marker([12.9716, 77.5946])
    .addTo(m)
    .bindPopup("AgriSense support")
    .openPopup();
</script>
{% endblock %}
